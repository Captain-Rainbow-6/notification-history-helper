name: Android CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up JDK 21
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      # This runs after a push; it does not replace reviewing files locally.
      - name: Reject tracked private or generated files
        shell: bash
        run: |
          if git ls-files | grep -Ei '(^|/)(local\.properties|\.env(\..*)?|.*\.(jks|keystore|p12|pfx|pem|key|apk|aab|apks|log|hprof|db|db-shm|db-wal)|secrets\.properties|signing\.properties|key\.properties|keystore\.properties)$|(^|/)(\.gradle|\.kotlin|\.idea|\.codex|\.agents|\.superpowers|\.worktrees|build)/|^docs/(superpowers|testing)/|^(internal|private|artifacts|validation)/'; then
            echo "A private, machine-local, signing, or generated file is tracked."
            exit 1
          fi

      - name: Build, test, and lint
        run: bash ./gradlew testDebugUnitTest lintDebug assembleDebug assembleDebugAndroidTest --no-daemon

      - name: Audit packaged permissions
        shell: bash
        run: |
          apk="app/build/outputs/apk/debug/app-debug.apk"
          allowed="io.github.captainrainbow.notificationhistoryhelper.DYNAMIC_RECEIVER_NOT_EXPORTED_PERMISSION"
          permissions="$($ANDROID_HOME/cmdline-tools/latest/bin/apkanalyzer manifest permissions "$apk")"
          while IFS= read -r permission; do
            if [[ -n "$permission" && "$permission" != "$allowed" ]]; then
              echo "Unexpected packaged permission: $permission"
              exit 1
            fi
          done <<< "$permissions"
