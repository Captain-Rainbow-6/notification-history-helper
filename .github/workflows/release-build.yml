name: Build Release APK

# Builds an unsigned intermediate file. Signing stays on the maintainer's computer.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out the selected commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Set up JDK 21
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: "21"

      - name: Reject tracked private or generated files
        run: |
          set -euo pipefail
          if git ls-files | grep -Ei '(^|/)(local\.properties|\.env(\..*)?|.*\.(jks|keystore|p12|pfx|pem|key|apk|aab|apks|log|hprof|db|db-shm|db-wal)|secrets\.properties|signing\.properties|key\.properties|keystore\.properties)$|(^|/)(\.gradle|\.kotlin|\.idea|\.codex|\.agents|\.superpowers|\.worktrees|build)/|^docs/(superpowers|testing)/|^(internal|private|artifacts|validation)/'; then
            echo "A private, machine-local, signing, or generated file is tracked."
            exit 1
          fi

      - name: Test, lint, and build unsigned Release APK
        run: bash ./gradlew testDebugUnitTest lintRelease assembleRelease --no-daemon

      - name: Check Release APK
        run: |
          set -euo pipefail
          apk="app/build/outputs/apk/release/app-release-unsigned.apk"
          analyzer="$ANDROID_HOME/cmdline-tools/latest/bin/apkanalyzer"
          test -s "$apk"
          test "$("$analyzer" manifest application-id "$apk")" = "io.github.captainrainbow.notificationhistoryhelper"
          test "$("$analyzer" manifest debuggable "$apk")" = "false"
          allowed="io.github.captainrainbow.notificationhistoryhelper.DYNAMIC_RECEIVER_NOT_EXPORTED_PERMISSION"
          permissions="$("$analyzer" manifest permissions "$apk")"
          while IFS= read -r permission; do
            if [[ -n "$permission" && "$permission" != "$allowed" ]]; then
              echo "Unexpected packaged permission: $permission"
              exit 1
            fi
          done <<< "$permissions"
          # No keystore or signing configuration is supplied to this workflow.

      - name: Prepare unsigned download and build record
        run: |
          set -euo pipefail
          apk="app/build/outputs/apk/release/app-release-unsigned.apk"
          output="$RUNNER_TEMP/unsigned-release"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          mkdir "$output"
          cp "$apk" "$output/app-release-unsigned.apk"
          (
            cd "$output"
            sha256sum app-release-unsigned.apk > SHA256SUMS-UNSIGNED.txt
            sha256sum --check SHA256SUMS-UNSIGNED.txt
          )
          {
            printf 'Artifact: unsigned Release APK; sign locally before installing or distributing.\n'
            printf 'Repository: %s\nCommit: %s\nRef: %s\n' "$GITHUB_REPOSITORY" "$GITHUB_SHA" "$GITHUB_REF"
            printf 'Workflow: %s\n' "$GITHUB_WORKFLOW_REF"
            printf 'Run: %s/%s/actions/runs/%s\nAttempt: %s\n' "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT"
            printf 'Build command: ./gradlew testDebugUnitTest lintRelease assembleRelease --no-daemon\n'
            printf 'Runner: %s / %s\n' "$RUNNER_OS" "$RUNNER_ARCH"
            printf '\nThis record is informational, not a cryptographic provenance attestation.\n'
            printf 'Signing changes the APK checksum. Generate a new checksum for the signed APK.\n'
          } > "$output/BUILD-INFO.txt"

      - name: Upload unsigned intermediate files
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: unsigned-release-${{ github.sha }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/unsigned-release/app-release-unsigned.apk
            ${{ runner.temp }}/unsigned-release/SHA256SUMS-UNSIGNED.txt
            ${{ runner.temp }}/unsigned-release/BUILD-INFO.txt
          if-no-files-found: error
          retention-days: 30
